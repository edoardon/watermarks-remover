name: Sync upstream weekly
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-upstream
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'edoardon/watermarks-remover'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream without overwriting local changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPOSITORY/merge-upstream" -f branch=main
